<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="botGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0056b3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Bot head circle -->
  <circle cx="12" cy="10" r="8" fill="url(#botGradient)" stroke="#ffffff" stroke-width="0.5"/>

  <!-- Eyes -->
  <circle cx="9.5" cy="8.5" r="1.2" fill="#ffffff"/>
  <circle cx="14.5" cy="8.5" r="1.2" fill="#ffffff"/>
  <circle cx="9.5" cy="8.5" r="0.6" fill="#007bff"/>
  <circle cx="14.5" cy="8.5" r="0.6" fill="#007bff"/>

  <!-- Mouth -->
  <path d="M 9 12 Q 12 14 15 12" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Antenna -->
  <line x1="12" y1="2" x2="12" y2="4" stroke="#007bff" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="12" cy="2" r="1" fill="#28a745"/>

  <!-- Communication signals -->
  <path d="M 6 6 Q 4 4 2 6" stroke="#007bff" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 18 6 Q 20 4 22 6" stroke="#007bff" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>

