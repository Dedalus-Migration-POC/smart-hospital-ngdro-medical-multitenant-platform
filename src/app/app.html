@if (appConfig(); as config) {
  <div class="d-flex flex-column h-100">
    <app-header [config]="config.header"></app-header>
    <main class="flex-grow-1 page-bg-container" [ngStyle]="backgroundStyle()">
      <div
        class="h-100"
        [ngClass]="!config.theme.fullWidth || currentUrl() !== '/' ? 'container' : ''"
      >
        <router-outlet></router-outlet>
      </div>
      @if (config.chatbot) {
        <div id="chatbot-widget" data-avatar-url="assets/chatbot/bot-avatar.png"></div>
      }
    </main>

    <app-footer [config]="config.footer"></app-footer>
  </div>
  <it-notifications />
  @if (config.cookieConsentConfig?.cookieConsentModal; as cookieConsentModal) {
    <app-cookie-consent-modal [config]="cookieConsentModal"></app-cookie-consent-modal>
  }

  @if (pageInfoPopUp(); as popup) {
    <app-alert-fixed
      [title]="popup.title | translate"
      [text]="popup.text | translate"
      [type]="popup.type"
    ></app-alert-fixed>
  }
} @else {
  <div>Caricamento configurazione...</div>
}
