@if (appConfig(); as config) {
  <div class="d-flex flex-column h-100">
    <app-header [config]="appConfig().header"></app-header>
    <main
      class="flex-grow-1 page-bg-container"
      [ngStyle]="{
        'background-image': bgImg() ? 'url(' + bgImg() + ')' : 'none',
        'background-color': bgColor() && !bgImg() ? bgColor() : '#ffffff',
      }"
    >
      <div class="container h-100">
        <router-outlet></router-outlet>
      </div>
      @if (config.chatbot) {
        <div id="chatbot-widget" data-avatar-url="assets/chatbot/bot-avatar.png"></div>
      }
    </main>

    <app-footer [config]="appConfig().footer"></app-footer>
  </div>
  <it-notifications />
  @if (config.cookieConsentConfig?.cookieConsentModal; as cookieConsentModal) {
    <app-cookie-consent-modal [config]="cookieConsentModal"></app-cookie-consent-modal>
  }

  @if (pageInfoPopUp()) {
    <app-alert-fixed
      [title]="pageInfoPopUp().title[lang()]"
      [text]="pageInfoPopUp().text[lang()]"
      [type]="pageInfoPopUp().type"
    ></app-alert-fixed>
  }
} @else {
  <div>Caricamento configurazione...</div>
}
