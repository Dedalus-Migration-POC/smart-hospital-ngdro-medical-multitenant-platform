<div
  class="modal d-block"
  [ngStyle]="backdropStyles()"
  tabindex="-1"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modalTitle"
  aria-describedby="modalBody"
>
  @if (config(); as config) {
    <div class="modal-dialog" [ngClass]="dialogClasses()" (click)="onBackdropClick()">
      <div
        class="modal-content"
        [ngClass]="containerBgClass()"
        [ngStyle]="containerStyles()"
        (click)="$event.stopPropagation()"
      >
        <div class="modal-header" [ngClass]="headerBgClass()" [ngStyle]="headerStyles()">
          <div class="d-flex flex-row align-items-center">
            @if (config.header.icon; as icon) {
              <app-icon [config]="icon" defaultMarginClass="ms-1" />
            }
            <h4
              class="modal-title"
              id="modalTitle"
              [ngClass]="getTextClasses(config.header.title)"
              [ngStyle]="getTextStyles(config.header.title)"
              [innerHTML]="config.header.title.text[lang()]"
            ></h4>
          </div>
          @if (config.header.closeButton !== false) {
            <button
              type="button"
              class="btn btn-sm p-0"
              [attr.aria-label]="'commons.close' | translate"
              (click)="onClose()"
            >
              <it-icon name="close" aria-hidden="true"></it-icon>
            </button>
          }
        </div>
        <div class="modal-body" id="modalBody" [ngClass]="bodyBgClass()" [ngStyle]="bodyStyles()">
          <p
            class="cursor-default mb-0"
            [ngClass]="getTextClasses(config.body.text)"
            [ngStyle]="getTextStyles(config.body.text)"
            [innerHTML]="config.body.text.text[lang()]"
          ></p>
        </div>
        @if (config.footer; as footer) {
          <div
            class="modal-footer"
            [ngClass]="[footerBgClass(), ...getFlexLayoutClasses(footer.layout)]"
            [ngStyle]="footerStyles()"
          >
            @if (footer.text; as footerText) {
              <p
                class="cursor-default mb-0"
                [ngClass]="getTextClasses(footerText)"
                [ngStyle]="getTextStyles(footerText)"
                [innerHTML]="footerText.text[lang()]"
              ></p>
            }
            @for (action of footer.actions; track $index) {
              <app-button [config]="action.button" (clicked)="onActionClick(action)" />
            }
          </div>
        }
      </div>
    </div>
  }
</div>
