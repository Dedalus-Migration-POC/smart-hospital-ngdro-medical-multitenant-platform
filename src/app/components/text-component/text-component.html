@if (config(); as config) {
  <div
    [innerHTML]="config.text[lang()]"
    class="cursor-default"
    [ngClass]="[
      'text-' + config.color,
      'text-' + config.textTransform,
      'text-decoration-' + config.textDecoration,
      'fw-' + config.fontWeight,
      'fs-' + config.fontSize,
      config?.marginTop || '',
      config?.marginBottom || '',
      config?.marginLeft || '',
      config?.marginRight || '',
      'lh-' + config?.lineHeight,
    ]"
  ></div>
}
