@if (effectiveCard(); as card) {
  @if (itemsLayout(); as layout) {
    <article
      class="it-card h-100"
      [ngClass]="getCardBackgroundClass(card)"
      [ngStyle]="getCardStyles(card)"
    >
      <button
        [attr.id]="card.id"
        [attr.aria-label]="card.ariaLabel?.[lang()] ?? null"
        type="button"
        class="btn p-0 w-100 h-100 text-start"
        [ngClass]="card.className"
        (click)="onCardClick($event, card.action)"
      >
        <div class="h-100 w-100" [ngClass]="getFlexLayoutClasses(layout)">
          <div class="d-flex align-items-start gap-2 w-100">
            <div class="flex-grow-1">
              @if (card.image) {
                <app-image-block [config]="toImageBlockConfig(card)"></app-image-block>
              }
            </div>

            @if (layout.direction === 'column') {
              <ng-container [ngTemplateOutlet]="iconTop"></ng-container>
            }
          </div>

          <div class="card-text w-100">
            @if (card.text.title.text[lang()]; as titleText) {
              <div
                [ngClass]="
                  getTextClasses(mergeTextStyles(mediaTextTheme()?.textStyle, card.text.title))
                "
                [ngStyle]="
                  getTextStyles(mergeTextStyles(mediaTextTheme()?.textStyle, card.text.title))
                "
              >
                {{ titleText }}
              </div>
            }

            @if (card.text.subTitle?.text?.[lang()]; as subTitleText) {
              <div
                [ngClass]="
                  getTextClasses(mergeTextStyles(mediaTextTheme()?.textStyle, card.text.subTitle))
                "
                [ngStyle]="
                  getTextStyles(mergeTextStyles(mediaTextTheme()?.textStyle, card.text.subTitle))
                "
              >
                {{ subTitleText }}
              </div>
            }
          </div>

          @if (layout.direction === 'row') {
            <div><ng-container [ngTemplateOutlet]="iconTop"></ng-container></div>
          }
        </div>
      </button>
    </article>

    <ng-template #iconTop>
      @if (card.blocked) {
        <img src="assets/images/lock.png" alt="" aria-hidden="true" />
      } @else if (card.action.type === 'externalLink') {
        <img src="assets/images/external_link.png" alt="" aria-hidden="true" />
      }
    </ng-template>
  }
}
