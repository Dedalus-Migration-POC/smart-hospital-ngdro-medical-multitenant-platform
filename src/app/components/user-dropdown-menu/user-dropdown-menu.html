@if (config(); as config) {
  <div class="dropdown h-100">
    <button
      type="button"
      class="mh-100 btn d-inline-flex align-items-center justify-content-center"
      [class.dropdown-toggle]="userProfile()"
      [ngClass]="
        [
          ...toggleButtonClasses(userProfile() ? config.button.loggedInUser : config.button.login),
          getHoverTextDecorationClass(userProfile() ? config.button.loggedInUser : config.button.login),
        ]
      "
      [ngStyle]="{
        ...getButtonStyles(userProfile() ? config.button.loggedInUser : config.button.login),
        ...getHoverTextDecorationStyles(
          userProfile() ? config.button.loggedInUser : config.button.login
        ),
      }"
      [attr.data-bs-toggle]="userProfile() ? 'dropdown' : null"
      [attr.aria-expanded]="userProfile() ? 'false' : null"
      [id]="userProfile() ? 'userDropdownMenu' : null"
      (click)="onButtonClick()"
      (shown.bs.dropdown)="onDropdownToggle(true)"
      (hidden.bs.dropdown)="onDropdownToggle(false)"
    >
      @if (userProfile(); as user) {
        @if (config.button.loggedInUser.icon; as icon) {
          <app-icon [config]="icon" defaultMarginClass="me-lg-2" />
        }
        <span
          class="user-dropdown-label d-none d-lg-inline-block"
          [ngClass]="loggedInUserTextClasses(config.button.loggedInUser)"
          [ngStyle]="getTextStyles(config.button.loggedInUser.textStyle)"
        >
          {{ user.firstName }} {{ user.lastName }}
        </span>
        @if (config.caret?.show) {
          <i
            class="ms-1"
            [ngClass]="caretClasses(config.caret!, config.button.loggedInUser.icon?.color)"
            [ngStyle]="caretStyles(config.button.loggedInUser.icon?.fontSize)"
            aria-hidden="true"
          ></i>
        }
      } @else {
        @if (config.button.login.icon; as icon) {
          <app-icon [config]="icon" defaultMarginClass="me-lg-2" />
        }
        <span
          class="user-dropdown-label d-none d-lg-inline-block"
          [ngClass]="getTextClasses(config.button.login.text)"
          [ngStyle]="getTextStyles(config.button.login.text)"
        >
          {{ config.button.login.text.text[lang()] }}
        </span>
      }
    </button>

    @if (userProfile()) {
      <div
        class="dropdown-menu"
        [ngClass]="[
          backgroundClass(config.dropdownMenu.background),
          borderClass(config.dropdownMenu.border),
        ]"
        [ngStyle]="{
          ...backgroundStyles(config.dropdownMenu),
          ...borderStyles(config.dropdownMenu.border),
        }"
        role="region"
        aria-labelledby="userDropdownMenu"
      >
        <div class="link-list-wrapper">
          <ul class="link-list">
            @for (item of config.dropdownMenu.items; track item.id) {
              <li>
                <a
                  class="dropdown-item list-item"
                  (click)="$event.preventDefault(); runAction(item.nameFunction)"
                  [id]="item.id"
                  [ngStyle]="itemStyles(item)"
                  (keyup.enter)="focusNext(item.id)"
                  href="#"
                  tabindex="0"
                >
                  @if (item.icon; as icon) {
                    <app-icon [config]="icon" defaultMarginClass="me-2" />
                  }
                  <span [ngClass]="getTextClasses(item.text)" [ngStyle]="getTextStyles(item.text)">
                    {{ item.text.text[lang()] }}
                  </span>
                </a>
              </li>
            }
          </ul>
        </div>
      </div>
    }
  </div>
}
