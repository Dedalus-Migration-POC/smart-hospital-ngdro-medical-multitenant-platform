@if (config(); as config) {
  <div
    [ngClass]="[
      config.className || '',
      ...getFlexLayoutClasses(config.layout),
      config.clickable ? 'cursor-pointer' : '',
    ]"
    (click)="handleClick()"
    (keydown)="handleKeydown($event)"
    [attr.role]="config.clickable ? 'button' : null"
    [attr.tabindex]="config.clickable ? '0' : null"
    [attr.title]="tooltipLabel()"
  >
    @if (config.image) {
      @if (config.image.type === 'url' || config.image.type === 'file') {
        <img
          class="img-fluid"
          [src]="config.image.value"
          [style.width]="config.image.width"
          [style.height]="config.image.height"
          loading="lazy"
          [attr.alt]="altText() ?? ''"
          [attr.aria-hidden]="ariaHidden()"
        />
      }

      @if (config.image.type === 'base64') {
        <img
          class="img-fluid"
          [src]="getSafeBase64Url(config.image.value)"
          [style.width]="config.image.width"
          [style.height]="config.image.height"
          loading="lazy"
          [attr.alt]="altText() ?? ''"
          [attr.aria-hidden]="ariaHidden()"
        />
      }

      @if (config.image.type === 'inlineSvg') {
        <div [innerHTML]="sanitizeSvg(config.image.value.replace(/\n/g, ''))"></div>
      }
    }

    @if (config.text) {
      <div
        class="d-flex flex-column"
        [ngClass]="[
          getAlignClass(config.layout?.align ?? 'start'),
          getJustifyClass(config.layout?.justify ?? 'start'),
        ]"
      >
        <div [ngClass]="getTextClasses(config.text.title)">
          {{ titleText() }}
        </div>

        @if (config.text.subTitle) {
          <div [ngClass]="getTextClasses(config.text.subTitle)">
            {{ subTitleText() }}
          </div>
        }
      </div>
    }
  </div>
}
