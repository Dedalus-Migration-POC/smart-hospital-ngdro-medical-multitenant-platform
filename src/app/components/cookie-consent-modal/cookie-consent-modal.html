@if (config(); as config) {
  <it-modal id="show_cookie_policy_modal" scrollable="true" footerShadow="true">
    <ng-container modalTitle>{{ config.title[lang()] }}</ng-container>

    <p [innerHTML]="config.text[lang()]"></p>

    <ng-container footer>
      <button
        itButton="primary"
        size="sm"
        type="button"
        data-bs-dismiss="modal"
        (click)="onCloseModal()"
      >
        {{ config.closeButtonText[lang()] }}
      </button>
    </ng-container>
  </it-modal>
}
