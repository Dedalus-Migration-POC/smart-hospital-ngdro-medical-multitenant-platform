@if (hasControl()) {
  <div [class]="wrapperClass()" [class.password-field]="type() === 'password'">
    <input
      [type]="effectiveType()"
      [class]="inputClass()"
      [class.password-input]="type() === 'password'"
      [ngClass]="iconClass() ? 'input-with-icon' : ''"
      [id]="fieldName()"
      [formControl]="control()!"
      [placeholder]="placeholder() ?? label()"
      [autocomplete]="autocomplete()"
      [maxlength]="maxlength() ?? null"
      [minlength]="minlength() ?? null"
      [min]="min() ?? null"
      [max]="max() ?? null"
      [attr.aria-label]="ariaLabel() ?? null"
      [attr.aria-labelledby]="ariaLabelledby() ?? null"
    />
    @if (showLabel()) {
      @if (iconClass()) {
        <i [class]="iconClass() + ' input-icon'"></i>
      }
      <label [for]="fieldName()" [ngClass]="iconClass() ? 'input-with-icon' : ''">
        {{ label() }}</label
      >
    }
    @if (type() === 'password') {
      <button
        type="button"
        class="password-toggle"
        [attr.aria-label]="
          (passwordVisible() ? 'input.hide-password' : 'input.show-password') | translate
        "
        [title]="(passwordVisible() ? 'input.hide-password' : 'input.show-password') | translate"
        [attr.aria-controls]="fieldName()"
        [attr.aria-pressed]="passwordVisible()"
        [disabled]="isDisabled()"
        (click)="togglePasswordVisibility()"
      >
        <i
          class="fa-solid"
          [class.fa-eye]="!passwordVisible()"
          [class.fa-eye-slash]="passwordVisible()"
          aria-hidden="true"
        ></i>
      </button>
    }
  </div>
} @else {
  <div
    [class]="wrapperClass()"
    [class.password-field]="type() === 'password'"
    [formGroup]="formGroup()!"
  >
    <input
      [type]="effectiveType()"
      [class]="inputClass()"
      [class.password-input]="type() === 'password'"
      [ngClass]="iconClass() ? 'input-with-icon' : ''"
      [id]="fieldName()"
      [formControlName]="fieldName()"
      [placeholder]="placeholder() ?? label()"
      [autocomplete]="autocomplete()"
      [maxlength]="maxlength() ?? null"
      [minlength]="minlength() ?? null"
      [min]="min() ?? null"
      [max]="max() ?? null"
      [attr.aria-label]="ariaLabel() ?? null"
      [attr.aria-labelledby]="ariaLabelledby() ?? null"
    />
    @if (showLabel()) {
      <label [for]="fieldName()" [ngClass]="iconClass() ? 'input-with-icon' : ''">
        @if (iconClass()) {
          <i [class]="iconClass() + ' input-icon'"></i>
        }
        {{ label() }}</label
      >
    }
    @if (type() === 'password') {
      <button
        type="button"
        class="password-toggle"
        [attr.aria-label]="
          (passwordVisible() ? 'input.hide-password' : 'input.show-password') | translate
        "
        [title]="(passwordVisible() ? 'input.hide-password' : 'input.show-password') | translate"
        [attr.aria-controls]="fieldName()"
        [attr.aria-pressed]="passwordVisible()"
        [disabled]="isDisabled()"
        (click)="togglePasswordVisibility()"
      >
        <i
          class="fa-regular"
          [class.fa-eye]="!passwordVisible()"
          [class.fa-eye-slash]="passwordVisible()"
          aria-hidden="true"
        ></i>
      </button>
    }
    @if (showErrors() && formGroup()) {
      <app-input-error-component
        [formGroup]="formGroup()!"
        [fieldName]="fieldName()"
        [errorMessages]="errorMessages()"
      ></app-input-error-component>
    }
  </div>
}
