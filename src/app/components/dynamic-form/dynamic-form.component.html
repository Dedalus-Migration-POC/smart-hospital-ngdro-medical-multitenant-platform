@if (formGroup()) {
  @if (showSubmitButton()) {
    <form
      [ngClass]="getFlexLayoutClasses(formConfig()?.layoutForm)"
      [formGroup]="formGroup()!"
      (ngSubmit)="onFormSubmit()"
    >
      <ng-container [ngTemplateOutlet]="formFields"></ng-container>

      <button
        type="submit"
        [ngClass]="[
          ...getFlexLayoutClasses(formConfig()?.submitButton?.layout),
          ...getButtonClasses(),
        ]"
        [disabled]="formGroup()?.invalid"
      >
        {{ getButtonLabel() }}
      </button>
    </form>
  } @else {
    <div [ngClass]="getFlexLayoutClasses(formConfig()?.layoutForm)" [formGroup]="formGroup()!">
      <ng-container [ngTemplateOutlet]="formFields"></ng-container>
    </div>
  }

  <ng-template #formFields>
    <div [ngClass]="getFlexLayoutClasses(formConfig()?.layoutFields)">
      @for (field of formConfig()?.fields; track field.id) {
        @if (field.type !== 'hidden') {
          <div
            [ngClass]="getFlexLayoutClasses(field.layoutField)"
            [style.flex-basis]="field.size?.basis ?? null"
            [style.width]="field.size?.width ?? null"
            [style.min-width]="field.size?.minWidth ?? null"
          >
            @if (isSelectField(field)) {
              <app-select-component
                [fieldName]="field.id"
                [formGroup]="formGroup()!"
                [label]="getFieldLabel(field.id)"
                [showLabel]="!!field.label"
                [showErrors]="true"
                [placeholder]="getFieldPlaceholder(field.id)"
                [options]="getSelectOptions(field)"
                [autocomplete]="'off'"
                [wrapperClass]="field.wrapperClass ?? 'select-wrapper mb-3'"
                [errorMessages]="getFieldErrorMessages(field)"
              ></app-select-component>
            } @else {
              <app-input-component
                [fieldName]="field.id"
                [formGroup]="formGroup()!"
                [type]="getFieldType(field.id)"
                [label]="getFieldLabel(field.id)"
                [showLabel]="!!field.label"
                [showErrors]="true"
                [placeholder]="getFieldPlaceholder(field.id)"
                [autocomplete]="'off'"
                [inputClass]="field.inputClass ?? 'form-control'"
                [wrapperClass]="field.wrapperClass ?? 'form-floating mb-3'"
                [errorMessages]="getFieldErrorMessages(field)"
              ></app-input-component>
            }
          </div>
        }
      }
    </div>
  </ng-template>
}
