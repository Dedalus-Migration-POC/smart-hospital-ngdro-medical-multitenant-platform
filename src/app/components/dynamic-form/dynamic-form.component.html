@if (formGroup()) {
  <form
    [ngClass]="getFlexLayoutClasses(formConfig()?.layoutForm)"
    [formGroup]="formGroup()!"
    (ngSubmit)="onFormSubmit()"
  >
    <div [ngClass]="getFlexLayoutClasses(formConfig()?.layoutFields)">
      @for (field of formConfig()?.fields; track field.id) {
        @if (field.type !== 'hidden') {
          <div [ngClass]="getFlexLayoutClasses(field.layoutField)">
            @if (isSelectField(field)) {
              <app-select-component
                [fieldName]="field.id"
                [formGroup]="formGroup()!"
                [label]="getFieldLabel(field.id)"
                [showLabel]="!!field.label"
                [showErrors]="true"
                [placeholder]="getFieldPlaceholder(field.id)"
                [options]="getSelectOptions(field)"
                [autocomplete]="'off'"
                [errorMessages]="getFieldErrorMessages(field)"
              ></app-select-component>
            } @else {
              <app-input-component
                [fieldName]="field.id"
                [formGroup]="formGroup()!"
                [type]="getFieldType(field.id)"
                [label]="getFieldLabel(field.id)"
                [showLabel]="!!field.label"
                [showErrors]="true"
                [placeholder]="getFieldPlaceholder(field.id)"
                [autocomplete]="'off'"
                [errorMessages]="getFieldErrorMessages(field)"
              ></app-input-component>
            }
          </div>
        }
      }
    </div>

    <button
      type="submit"
      [ngClass]="[
        ...getFlexLayoutClasses(formConfig()?.submitButton?.layout),
        ...getButtonClasses(),
      ]"
      [disabled]="formGroup()?.invalid"
    >
      {{ getButtonLabel() }}
    </button>
  </form>
}
