@if (hasControl()) {
  <div [class]="wrapperClass()">
    @if (showLabel()) {
      <label class="app-select-label" [for]="fieldName()">{{ label() }}</label>
    }
    <select
      [id]="fieldName()"
      [class]="selectClass()"
      [formControl]="control()!"
      [attr.aria-label]="ariaLabel() ?? null"
      [attr.autocomplete]="autocomplete()"
      (change)="onSelectChange($any($event.target).value)"
      (keyup.enter)="focusNext()"
      (keyup.tab)="focusNext()"
    >
      <option value="">{{ placeholder() }}</option>
      @for (option of options(); track option.value) {
        <option [value]="option.value">{{ truncateLabel(option.label) }}</option>
      }
    </select>
  </div>
} @else {
  <div [class]="wrapperClass()" [formGroup]="formGroup()!">
    @if (showLabel()) {
      <label
        class="app-select-label"
        [for]="fieldName()"
        [ngClass]="formGroup()?.get(fieldName())?.value ? 'active' : ''"
      >
        {{ label() }}
      </label>
    }
    <select
      [id]="fieldName()"
      [class]="selectClass()"
      [formControlName]="fieldName()"
      [attr.aria-label]="ariaLabel() ?? null"
      [attr.autocomplete]="autocomplete()"
      (change)="onSelectChange($any($event.target).value)"
      (keyup.enter)="focusNext()"
      (keyup.tab)="focusNext()"
    >
      <option value="">{{ placeholder() }}</option>
      @for (option of options(); track option.value) {
        <option [value]="option.value">{{ truncateLabel(option.label) }}</option>
      }
    </select>
    @if (showErrors() && formGroup()) {
      <app-input-error-component
        [formGroup]="formGroup()!"
        [fieldName]="fieldName()"
        [errorMessages]="errorMessages()"
      ></app-input-error-component>
    }
  </div>
}
