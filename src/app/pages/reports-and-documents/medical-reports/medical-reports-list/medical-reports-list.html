@if (pageConfig(); as pageConfig) {
  @if (pageConfig.breadcrumb) {
    <app-breadcrumb [config]="pageConfig.breadcrumb"></app-breadcrumb>
  }

  <!-- Form sempre visibile -->
  @if (formConfig()) {
    <div class="mt-4 mb-4">
      <app-dynamic-form
        [formConfig]="formConfig()"
        [lang]="lang()"
        (formSubmit)="onFormSubmit($event)"
      ></app-dynamic-form>
    </div>
  }

  @if (reports()!.length > 0) {
    <div class="mt-4 mb-4">
      <app-card [config]="renderedCardsConfig()"></app-card>
    </div>
  }
  @if (!loading() && !error() && reports()!.length === 0) {
    <div class="d-flex flex-column align-items-center justify-content-center gap-3 mt-4">
      <app-image-block [config]="pageConfig.message.notFound"></app-image-block>
    </div>
  }
  @if (loading()) {
    <app-spinner
      [fullScreen]="true"
      text="Loading"
      [className]="'flex-column gap-3 text-secondary'"
    ></app-spinner>
  }

  @if (error()) {
    <div class="d-flex flex-column align-items-center justify-content-center gap-3 mt-4">
      <app-image-block [config]="pageConfig.message.error"></app-image-block>
    </div>
  }
}
