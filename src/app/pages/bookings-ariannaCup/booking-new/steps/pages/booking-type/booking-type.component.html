<div class="container-booking-type">
  <h2 class="mt-3 fw-semibold">
    {{ 'bookings.booking-new.booking-type.select-type' | translate }}
  </h2>
  <div class="d-flex flex-column gap-3 mt-3">
    @for (booking of bookingType; track booking.id) {
      <button
        type="button"
        class="card shadow-sm border-light text-start p-3"
        (click)="onCardSelected(booking)"
      >
        <div class="fw-semibold">{{ booking.titleI18n | translate }}</div>
        <div class="text-secondary">{{ booking.descriptionI18n | translate }}</div>
      </button>
    }
  </div>
</div>
