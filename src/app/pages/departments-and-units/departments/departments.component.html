<!-- @if (clinicalRecordsLoading$ | async) { <app-loading-full-screen></app-loading-full-screen> } -->
@if (pageConfig()?.breadcrumb) {
  <app-breadcrumb [config]="pageConfig()?.breadcrumb"></app-breadcrumb>
}
<div class="department-search-wrapper">
  <app-input-component
    [control]="searchText"
    [fieldName]="'searchText'"
    [label]="'departments-page.search-label' | translate"
    [placeholder]="'departments-page.search-label' | translate"
    [showErrors]="false"
    [iconClass]="'fa-solid fa-magnifying-glass'"
  ></app-input-component>
</div>

@if (departmentsList()) {
  <div class="mt-4 mb-4">
    <app-card [config]="renderedCardsConfig()"></app-card>
  </div>
} @else {
  <p>{{ 'departments-page.no-departments' | translate }}</p>
}
