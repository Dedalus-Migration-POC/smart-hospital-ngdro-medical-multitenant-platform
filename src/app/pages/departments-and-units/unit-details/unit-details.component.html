@if (breadcrumbConfig()) {
  <app-breadcrumb [config]="breadcrumbConfig()"></app-breadcrumb>
}

@if (pageConfig(); as pageConfig) {
  @for (section of renderedSections(); track section.id) {
    <section
      class="mt-4 mb-4"
      [attr.id]="section.id"
      [ngClass]="[section.className ?? '', section.background ? 'bg-' + section.background : '']"
      [style.height]="section.height ?? null"
    >
      <app-areas-layout [areas]="section.areas"></app-areas-layout>
    </section>
  }
}
