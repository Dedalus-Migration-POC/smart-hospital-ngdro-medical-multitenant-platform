@if (breadcrumbConfig()) {
  <app-breadcrumb [config]="breadcrumbConfig()"></app-breadcrumb>
}

<div class="department-search-wrapper">
  <app-input-component
    [control]="searchUnitText"
    [fieldName]="'searchUnitText'"
    [label]="'departments-units.search-label' | translate"
    [placeholder]="'departments-units.search-label' | translate"
    [showErrors]="false"
    [iconClass]="'fa-solid fa-magnifying-glass'"
  ></app-input-component>
</div>

@if (units()) {
  <div class="mt-4 mb-4">
    <app-card [config]="renderedCardsConfig()"></app-card>
  </div>
} @else {
  <p>{{ 'departments-units.no-units' | translate }}</p>
}
