@if (pageConfig(); as pageConfig) {
  @if (pageConfig.breadcrumb) {
    <app-breadcrumb [config]="pageConfig.breadcrumb"></app-breadcrumb>
  }

  @if (loading()) {
    <app-spinner
      [fullScreen]="true"
      text="Loading"
      [className]="'flex-column gap-3 text-secondary'"
    ></app-spinner>
  }

  @if (error()) {
    <div class="d-flex flex-column align-items-center justify-content-center gap-3 mt-4">
      <app-image-block [config]="pageConfig.errorMessage.imageBlockConfig"></app-image-block>
    </div>
  }

  @if ((!payments() || !payments().length) && !error()) {
    <div class="d-flex flex-column align-items-center justify-content-center gap-3 mt-4">
      <app-image-block [config]="pageConfig.notFoundMessage.imageBlockConfig"></app-image-block>
    </div>
  }

  @if (payments().length > 0) {
    <it-tab-container>
      <it-tab-item [label]="'payments-page.to-pay' | translate" [active]="true">
        <div class="mt-4">
          <app-card [config]="renderedPendingCardsConfig()"></app-card>
        </div>
      </it-tab-item>

      <it-tab-item [label]="'payments-page.payed' | translate">
        <div class="mt-4">
          <app-card [config]="renderedPaidCardsConfig()"></app-card>
        </div>
      </it-tab-item>
    </it-tab-container>
  }
}
