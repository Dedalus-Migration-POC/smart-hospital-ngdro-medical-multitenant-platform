<div class="col-12 col-sm col-lg-8 my-3">
  <article class="it-card rounded shadow p-4">
    @let formGroup = form();
    @let config = userConfig();

    @if (formGroup && config) {
      <form [formGroup]="formGroup" (submit)="$event.stopPropagation()" (ngSubmit)="submitForm()">
        @for (section of config.sections; track $index) {
          <section class="mb-4">
            <h2
              [ngClass]="{
                'pb-4': !section.readOnly && !section.subTitle,
                'mb-0': section.subTitle,
              }"
              class="fs-2 cursor-default"
            >
              {{ section.title[lang()] }}
            </h2>
            @if (section.subTitle) {
              <div class="pb-4 text-600 cursor-default">
                {{ section.subTitle[lang()] }}
              </div>
            }

            @for (dynamicFormConfig of getDynamicForms(section); track $index) {
              <app-dynamic-form
                [formConfig]="dynamicFormConfig"
                [formGroupInput]="formGroup"
                [lang]="lang()"
              ></app-dynamic-form>
            }
          </section>
        }

        <app-consents-form
          [userConsentsForm]="userConsentsForm()"
          [isProfile]="!isRegistration()"
          (toggleConsent)="toggleConsent.emit($event)"
          [consentsConfig]="config.consents"
        ></app-consents-form>

        <button type="submit" [ngClass]="getSubmitButtonClasses()">
          {{ config.submitButton?.label?.[lang()] }}
        </button>
      </form>
    }
  </article>
</div>
