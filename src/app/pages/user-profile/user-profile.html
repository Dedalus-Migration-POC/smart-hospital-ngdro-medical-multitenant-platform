@if (pageConfig(); as pageConfig) {
  @if (userProfile()) {
    @if (pageConfig.page.breadcrumb) {
      <app-breadcrumb [config]="pageConfig.page.breadcrumb"></app-breadcrumb>
    }

    <app-user-profile-registration
      [form]="form()"
      [userConfig]="userConfig()"
      [userConsentsForm]="userConsentsForm"
      (submit)="submit()"
      (toggleConsent)="toggleConsent($event)"
    />
  }
}
@if (loading()) {
  <app-spinner
    [fullScreen]="true"
    text="Loading"
    [className]="'flex-column gap-3 text-danger'"
  ></app-spinner>
}
