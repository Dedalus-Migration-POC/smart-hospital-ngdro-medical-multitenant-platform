@if (pageConfig(); as pageConfig) {
  @if (userProfile()) {
    @if (pageConfig.breadcrumb) {
      <app-breadcrumb
        [config]="isRegistration() ? pageConfig.breadcrumbRegistration : pageConfig.breadcrumb"
      ></app-breadcrumb>
    }

    <app-user-profile-registration
      [form]="form()"
      [userConfig]="pageConfig"
      [userConsentsForm]="userConsentsForm"
      [isRegistration]="isRegistration()"
      (submit)="submit()"
      (toggleConsent)="toggleConsent($event)"
    />
  }
}
@if (loading()) {
  <app-spinner
    [fullScreen]="true"
    text="Loading"
    [className]="'flex-column gap-3 text-danger'"
  ></app-spinner>
}
