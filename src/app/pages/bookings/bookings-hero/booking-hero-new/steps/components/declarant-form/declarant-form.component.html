<div>
  @if (user(); as user) {
    <div
      class="subtitle"
      [innerHTML]="
        'bookings-hero.booking-new.delega.declarantForm.subtitle'
          | translate
            : {
                user: user.firstName + ' ' + user.lastName,
                userFiscalCode: user.fiscalCode.toUpperCase().startsWith('TINIT-')
                  ? user.fiscalCode.slice(6).toUpperCase()
                  : user.fiscalCode.toUpperCase(),
              }
      "
    ></div>
  }
  <hr />
  <div
    class="subtitle-2 fw-bold text-center"
    [innerHTML]="'bookings-hero.booking-new.delega.declarantForm.subtitle-2' | translate"
  ></div>

  <form [formGroup]="declarantForm" (ngSubmit)="submit()">
    <div class="booking-person-form-container pt-5 pb-5">
      <div class="row">
        <div class="col-12 col-sm-6">
          <div class="form-field">
            <label for="declarantForm-birthDate" class="input-label">
              {{ 'bookings-hero.booking-new.delega.declarantForm.birthDate' | translate }}
            </label>
            <app-input-component
              [formGroup]="declarantForm"
              [fieldName]="'birthDate'"
              [type]="'date'"
              [inputClass]="'form-control'"
              [showLabel]="false"
              [showErrors]="true"
              [wrapperClass]="'form-field'"
              [ariaLabel]="'Data di nascita'"
              [max]="dateFilter | date: 'yyyy-MM-dd'"
              [autocomplete]="'off'"
            ></app-input-component>
          </div>
        </div>
        <div class="col-12 col-sm-6">
          <div class="form-field">
            <label for="declarantForm-birthCountry" class="input-label">
              {{ 'bookings-hero.booking-new.delega.declarantForm.birthCountry' | translate }}
            </label>
            <app-select-component
              [formGroup]="declarantForm"
              [fieldName]="'birthCountry'"
              [showLabel]="false"
              [showErrors]="true"
              [ariaLabel]="'Paese di nascita'"
              [selectClass]="'form-control'"
              [autocomplete]="'off'"
              [options]="
                (nations() ?? []).map((country) => ({
                  value: country.key,
                  label: country.label,
                }))
              "
            ></app-select-component>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12 col-sm-6">
          <div class="form-field">
            <label for="declarantForm-birthProvince" class="input-label">
              {{ 'bookings-hero.booking-new.delega.declarantForm.birthProvince' | translate }}
            </label>
            <app-select-component
              [formGroup]="declarantForm"
              [fieldName]="'birthProvince'"
              [showLabel]="false"
              [showErrors]="true"
              [selectClass]="'form-control'"
              [autocomplete]="'off'"
              [options]="provinces().map((province) => ({ value: province, label: province }))"
              (valueChanged)="onChangeBirthProvince()"
            ></app-select-component>
          </div>
        </div>
        <div class="col-12 col-sm-6">
          <div class="form-field">
            <label for="declarantForm-birthCity" class="input-label">
              {{ 'bookings-hero.booking-new.delega.declarantForm.birthCity' | translate }}
            </label>
            <app-select-component
              [formGroup]="declarantForm"
              [fieldName]="'birthCity'"
              [showLabel]="false"
              [showErrors]="true"
              [selectClass]="'form-control'"
              [autocomplete]="'off'"
              [options]="cities().map((city) => ({ value: city, label: city }))"
            ></app-select-component>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12 col-sm-6">
          <div class="form-field">
            <label for="declarantForm-currentProvince" class="input-label">
              {{ 'bookings-hero.booking-new.delega.declarantForm.currentProvince' | translate }}
            </label>
            <app-select-component
              [formGroup]="declarantForm"
              [fieldName]="'currentProvince'"
              [showLabel]="false"
              [showErrors]="true"
              [selectClass]="'form-control'"
              [autocomplete]="'off'"
              [options]="provinces().map((province) => ({ value: province, label: province }))"
              (valueChanged)="onChangeResidenceProvince()"
            ></app-select-component>
          </div>
        </div>
        <div class="col-12 col-sm-6">
          <div class="form-field">
            <label for="declarantForm-currentCity" class="input-label">
              {{ 'bookings-hero.booking-new.delega.declarantForm.currentCity' | translate }}</label
            >
            <app-select-component
              [formGroup]="declarantForm"
              [fieldName]="'currentCity'"
              [showLabel]="false"
              [showErrors]="true"
              [selectClass]="'form-control'"
              [autocomplete]="'off'"
              [options]="citiesResidence().map((city) => ({ value: city, label: city }))"
            ></app-select-component>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12 col-sm-6">
          <div class="form-field">
            <label for="declarantForm-address" class="input-label">
              {{ 'bookings-hero.booking-new.delega.declarantForm.address' | translate }}
            </label>
            <app-input-component
              [formGroup]="declarantForm"
              [fieldName]="'address'"
              [inputClass]="'form-control'"
              [showLabel]="false"
              [showErrors]="true"
              [wrapperClass]="'form-field'"
              [ariaLabel]="'Indirizzo di residenza'"
              [autocomplete]="'off'"
            ></app-input-component>
          </div>
        </div>
        <div class="col-6">
          <div class="form-field">
            <label for="declarantForm-currentCityCap" class="input-label">
              {{ 'bookings-hero.booking-new.delega.declarantForm.currentCityCap' | translate }}
            </label>
            <app-input-component
              [formGroup]="declarantForm"
              [fieldName]="'currentCityCap'"
              [inputClass]="'form-control'"
              [maxlength]="5"
              [showLabel]="false"
              [showErrors]="true"
              [wrapperClass]="'form-field'"
              [ariaLabel]="'CAP'"
              [autocomplete]="'off'"
            ></app-input-component>
          </div>
        </div>
      </div>
    </div>
  </form>

  <button type="button" class="btn btn-outline-primary" (click)="setActiveTab.emit(2)">
    {{ 'bookings-hero.booking-new.delega.declarantForm.go-to-person-form' | translate }}
  </button>
</div>
