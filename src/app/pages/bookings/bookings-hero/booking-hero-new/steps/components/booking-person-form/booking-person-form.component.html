<div>
  <div>
    {{ 'bookings-hero.booking-new.delega.bookingPersonForm.subtitle' | translate }}
  </div>
  <hr />
  @if (delegateType(); as delegateType) {
    <div
      class="subtitle-2"
      [innerHTML]="
        'bookings-hero.booking-new.delega.bookingPersonForm.subtitle-2'
          | translate: { delegateType: delegateType }
      "
    ></div>
  }

  <form [formGroup]="bookingPersonForm" (ngSubmit)="submit()">
    <div class="booking-person-form-container pt-5 pb-5">
      <div class="row">
        <div class="col-12 col-sm-6">
          <div class="form-field">
            <label for="firstName" class="input-label">
              {{ 'bookings-hero.booking-new.delega.bookingPersonForm.firstName' | translate }}
            </label>
            <app-input-component
              [formGroup]="bookingPersonForm"
              [fieldName]="'firstName'"
              [inputClass]="'form-control'"
              [wrapperClass]="'form-field'"
              [showLabel]="false"
              [showErrors]="true"
              [ariaLabel]="'Nome'"
              [autocomplete]="'off'"
            ></app-input-component>
          </div>
        </div>
        <div class="col-12 col-sm-6">
          <div class="form-field">
            <label for="lastName" class="input-label">
              {{ 'bookings-hero.booking-new.delega.bookingPersonForm.lastName' | translate }}
            </label>
            <app-input-component
              [formGroup]="bookingPersonForm"
              [fieldName]="'lastName'"
              [inputClass]="'form-control'"
              [wrapperClass]="'form-field'"
              [showLabel]="false"
              [showErrors]="true"
              [ariaLabel]="'Cognome'"
              [autocomplete]="'off'"
            ></app-input-component>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12 col-sm-6">
          <div class="form-field">
            <label for="birthDate" class="input-label">
              {{ 'bookings-hero.booking-new.delega.bookingPersonForm.birthDate' | translate }}
            </label>
            <app-input-component
              [formGroup]="bookingPersonForm"
              [fieldName]="'birthDate'"
              [type]="'date'"
              [inputClass]="'form-control'"
              [wrapperClass]="'form-field'"
              [showLabel]="false"
              [showErrors]="true"
              [ariaLabel]="'Data di nascita'"
              [max]="dateFilter | date: 'yyyy-MM-dd'"
              [autocomplete]="'off'"
            ></app-input-component>
          </div>
        </div>
        <div class="col-12 col-sm-6">
          <div class="form-field">
            <label for="birthCountry" class="input-label">
              {{ 'bookings-hero.booking-new.delega.bookingPersonForm.birthCountry' | translate }}
            </label>
            <app-select-component
              [formGroup]="bookingPersonForm"
              [fieldName]="'birthCountry'"
              [showLabel]="false"
              [showErrors]="true"
              [ariaLabel]="'Paese di nascita'"
              [selectClass]="'form-control'"
              [autocomplete]="'off'"
              [options]="
                (nations() ?? []).map((country) => ({
                  value: country.key,
                  label: country.label,
                }))
              "
            ></app-select-component>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12 col-sm-6">
          <div class="form-field">
            <label for="birthProvince" class="input-label">
              {{ 'bookings-hero.booking-new.delega.bookingPersonForm.birthProvince' | translate }}
            </label>
            <app-select-component
              [formGroup]="bookingPersonForm"
              [fieldName]="'birthProvince'"
              [showLabel]="false"
              [showErrors]="true"
              [selectClass]="'form-control'"
              [autocomplete]="'off'"
              [options]="provinces().map((province) => ({ value: province, label: province }))"
              (valueChanged)="onChangeBirthProvince()"
            ></app-select-component>
          </div>
        </div>
        <div class="col-12 col-sm-6">
          <div class="form-field">
            <label for="birthCity" class="input-label">
              {{ 'bookings-hero.booking-new.delega.bookingPersonForm.birthCity' | translate }}
            </label>
            <app-select-component
              [formGroup]="bookingPersonForm"
              [fieldName]="'birthCity'"
              [showLabel]="false"
              [showErrors]="true"
              [selectClass]="'form-control'"
              [autocomplete]="'off'"
              [options]="cities().map((city) => ({ value: city, label: city }))"
            ></app-select-component>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12 col-sm-6">
          <div class="form-field">
            <label for="taxCode" class="input-label">
              {{ 'bookings-hero.booking-new.delega.bookingPersonForm.taxCode' | translate }}
            </label>
            <app-input-component
              [formGroup]="bookingPersonForm"
              [fieldName]="'taxCode'"
              [inputClass]="'form-control text-uppercase'"
              [showLabel]="false"
              [wrapperClass]="'form-field'"
              [showErrors]="true"
              [ariaLabel]="'Codice Fiscale'"
              [autocomplete]="'off'"
            ></app-input-component>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12 col-sm-6">
          <div class="form-field">
            <label for="currentProvince" class="input-label">
              {{ 'bookings-hero.booking-new.delega.bookingPersonForm.currentProvince' | translate }}
            </label>
            <app-select-component
              [formGroup]="bookingPersonForm"
              [fieldName]="'currentProvince'"
              [showLabel]="false"
              [showErrors]="true"
              [selectClass]="'form-control'"
              [autocomplete]="'off'"
              [options]="provinces().map((province) => ({ value: province, label: province }))"
              (valueChanged)="onChangeResidenceProvince()"
            ></app-select-component>
          </div>
        </div>
        <div class="col-12 col-sm-6">
          <div class="form-field">
            <label for="currentCity" class="input-label">
              {{
                'bookings-hero.booking-new.delega.bookingPersonForm.currentCity' | translate
              }}</label
            >
            <app-select-component
              [formGroup]="bookingPersonForm"
              [fieldName]="'currentCity'"
              [showLabel]="false"
              [showErrors]="true"
              [selectClass]="'form-control'"
              [autocomplete]="'off'"
              [options]="citiesResidence().map((city) => ({ value: city, label: city }))"
            ></app-select-component>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12 col-sm-6">
          <div class="form-field">
            <label for="address" class="input-label">
              {{ 'bookings-hero.booking-new.delega.bookingPersonForm.address' | translate }}
            </label>
            <app-input-component
              [formGroup]="bookingPersonForm"
              [fieldName]="'address'"
              [inputClass]="'form-control'"
              [wrapperClass]="'form-field'"
              [showLabel]="false"
              [showErrors]="true"
              [ariaLabel]="'Indirizzo di residenza'"
              [autocomplete]="'off'"
            ></app-input-component>
          </div>
        </div>

        <div class="col-6">
          <div class="form-field">
            <label for="houseNumber" class="input-label">
              {{ 'bookings-hero.booking-new.delega.bookingPersonForm.houseNumber' | translate }}
            </label>
            <app-input-component
              [formGroup]="bookingPersonForm"
              [fieldName]="'houseNumber'"
              [inputClass]="'form-control'"
              [wrapperClass]="'form-field'"
              [maxlength]="10"
              [showLabel]="false"
              [showErrors]="true"
              [ariaLabel]="'Numero civico'"
              [autocomplete]="'off'"
            ></app-input-component>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-6">
          <div class="form-field">
            <label for="currentCityCap" class="input-label">
              {{ 'bookings-hero.booking-new.delega.bookingPersonForm.currentCityCap' | translate }}
            </label>
            <app-input-component
              [formGroup]="bookingPersonForm"
              [fieldName]="'currentCityCap'"
              [inputClass]="'form-control'"
              [maxlength]="5"
              [showLabel]="false"
              [wrapperClass]="'form-field'"
              [showErrors]="true"
              [ariaLabel]="'CAP'"
              [autocomplete]="'off'"
            ></app-input-component>
          </div>
        </div>
      </div>

      <div class="form-field false-statements-disclaimer mt-5">
        <input
          formControlName="informative"
          type="checkbox"
          id="informative-disclaimer"
          autocomplete="off"
        />
        <label
          for="informative-disclaimer"
          class="form-control-label"
          [innerHTML]="'bookings-hero.booking-new.delega.bookingPersonForm.informative' | translate"
        ></label>
      </div>
    </div>
  </form>

  <button type="button" class="btn btn-outline-primary" (click)="setActiveTab.emit(1)">
    {{ 'bookings-hero.booking-new.delega.bookingPersonForm.go-to-declarant-form' | translate }}
  </button>

  <!-- <button
                    type="submit"
                    (click)="submit()"
                    [disabled]="bookingPersonForm.invalid"
                    class="btn btn-primary"
                    >
                    Prosegui
                  </button> -->
</div>
