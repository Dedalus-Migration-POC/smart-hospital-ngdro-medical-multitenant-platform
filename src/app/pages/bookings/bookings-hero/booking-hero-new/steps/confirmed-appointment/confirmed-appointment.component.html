<div class="row justify-content-center mt-5 mb-5">
  <div class="col-12 col-lg-8">
    <div class="w-100 d-flex flex-column">
      <h2 class="fw-semibold mb-4">
        {{ 'bookings-hero.booking-new.confirmed-appointment.title' | translate }}
      </h2>

      @if (appointment(); as appointment) {
        <div class="card card-teaser no-after shadow-sm border-light">
          <div class="card-body--multi-use d-flex flex-column h-100 w-100">
            <div class="card-title mb-3 lh-sm text-capitalize cursor-default h4">
              {{ 'bookings-hero.booking-new.confirmed-appointment.summary' | translate }}
            </div>
            <div class="card-content d-flex flex-column w-100">
              @for (el of confirmInfo(); track el) {
                <div>
                  @if (el.value) {
                    <div class="row pb-3">
                      <div class="col-12 col-sm-4 confirm-info-label">
                        {{ el.label[lang()] }}
                      </div>
                      <div class="col confirm-info-value">{{ el.value }}</div>
                    </div>
                  }
                </div>
              }
            </div>
            <div class="buttons-container">
              <button type="button" class="btn btn-primary" (click)="onAddToCalendar()">
                {{ 'bookings-hero.booking-new.confirmed-appointment.calendar-button' | translate }}
              </button>
              <button type="button" class="btn btn-primary" (click)="onPrintMemo()">
                {{ 'bookings-hero.booking-new.confirmed-appointment.print-button' | translate }}
              </button>
              <button type="button" class="btn btn-primary" (click)="onSendEmailNotification()">
                {{ 'bookings-hero.booking-new.confirmed-appointment.email-button' | translate }}
              </button>
              <button type="button" class="btn btn-primary" (click)="onPay()">
                {{ 'bookings-hero.booking-new.confirmed-appointment.pay-button' | translate }}
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
