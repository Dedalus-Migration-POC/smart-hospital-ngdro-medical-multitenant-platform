@if (pageConfig(); as pageConfig) {
  @if (pageConfig.breadcrumb) {
    <app-breadcrumb [config]="pageConfig.breadcrumb" (buttonAction)="newBooking()"></app-breadcrumb>
  }

  @if (bookingsList(); as state) {
    @if (state.bookings.length > 0) {
      <div class="mt-4 mb-4">
        <app-card [config]="renderedCardsConfig()"></app-card>
      </div>
    }
    @if (!state.loading && !state.error && !state.bookings.length) {
      <div class="d-flex flex-column align-items-center justify-content-center gap-3 mt-4">
        <app-image-block [config]="pageConfig.notFoundMessage.imageBlockConfig"></app-image-block>
      </div>
    }
    @if (state.loading || isDeleteBooking()) {
      <app-spinner
        [fullScreen]="true"
        text="Loading"
        [className]="'flex-column gap-3 text-secondary'"
      ></app-spinner>
    }

    @if (state.error) {
      <div class="d-flex flex-column align-items-center justify-content-center gap-3 mt-4">
        <app-image-block [config]="pageConfig.errorMessage.imageBlockConfig"></app-image-block>
      </div>
    }
  }
}
