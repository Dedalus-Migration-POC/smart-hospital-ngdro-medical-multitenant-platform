@if (pageConfig(); as pageConfig) {
  @if (breadcrumbConfig(); as breadcrumb) {
    <app-breadcrumb [config]="breadcrumb"></app-breadcrumb>
  }

  @if (!loading()) {
    @if (appointment()) {
      <div class="details-container mx-auto mt-4">
        <app-card [config]="renderedCardsConfig()" />

        <div class="d-flex justify-content-between mt-5 mb-5">
          <a
            class="btn btn-outline-secondary"
            [class.disabled]="requestingCheckIn()"
            [routerLink]="['/booking-a4h', 'appointments']"
          >
            {{ 'appointments.back' | translate }}
          </a>
        </div>
      </div>
    } @else if (error()) {
      <div class="d-flex flex-column align-items-center justify-content-center gap-3 mt-4">
        <app-image-block [config]="pageConfig.message?.error"></app-image-block>
        <button type="button" class="btn btn-outline-primary" (click)="refresh()">
          {{ 'appointments.refresh' | translate }}
        </button>
      </div>
    } @else {
      <div class="d-flex flex-column align-items-center justify-content-center gap-3 mt-4">
        <app-image-block [config]="pageConfig.message?.notFound"></app-image-block>
        <a class="btn btn-outline-secondary" [routerLink]="['/booking-a4h', 'appointments']">
          {{ 'appointments.back' | translate }}
        </a>
      </div>
    }
  }
}

@if (loading()) {
  <app-spinner
    [fullScreen]="true"
    [text]="
      (requestingCheckIn()
        ? 'appointments.requesting-check-in'
        : deleting()
          ? 'commons.loading'
          : 'appointments.details-page.fetching-appointment'
      ) | translate
    "
    [className]="'flex-column gap-3 text-secondary'"
  ></app-spinner>
}
