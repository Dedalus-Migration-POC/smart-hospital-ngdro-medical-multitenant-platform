@if (pageConfig(); as pageConfig) {
  @if (pageConfig.breadcrumb) {
    <app-breadcrumb [config]="pageConfig.breadcrumb"></app-breadcrumb>
  }

  <ng-template #tabContent let-appointments="appointments" let-cards="cards">
    <div class="mt-4">
      @if (error()) {
        <div class="d-flex flex-column align-items-center justify-content-center gap-3 mt-4">
          <app-image-block [config]="pageConfig.message?.error"></app-image-block>
          <button type="button" class="btn btn-outline-primary" (click)="refresh()">
            {{ 'appointments.refresh' | translate }}
          </button>
        </div>
      } @else if (!appointments.length && !loading()) {
        <div class="d-flex flex-column align-items-center justify-content-center gap-3 mt-4">
          <app-image-block [config]="pageConfig.message?.notFound"></app-image-block>
        </div>
      } @else if (appointments.length) {
        <app-card [config]="cards"></app-card>
      }
    </div>
  </ng-template>

  @for (acceptedFirst of [showAcceptedFirst()]; track acceptedFirst) {
    <it-tab-container>
      <it-tab-item
        [label]="'appointments.toggleAppointments' | translate"
        [active]="!acceptedFirst"
      >
        <ng-container
          *ngTemplateOutlet="
            tabContent;
            context: { appointments: pendingAppointments(), cards: pendingCards() }
          "
        ></ng-container>
      </it-tab-item>

      <it-tab-item [label]="'appointments.toggleOnline' | translate" [active]="acceptedFirst">
        <ng-container
          *ngTemplateOutlet="
            tabContent;
            context: { appointments: acceptedAppointments(), cards: acceptedCards() }
          "
        ></ng-container>
      </it-tab-item>
    </it-tab-container>
  }
}

@if (loading()) {
  <app-spinner
    [fullScreen]="true"
    [text]="requestingCheckIn() ? ('appointments.requesting-check-in' | translate) : 'Loading'"
    [className]="'flex-column gap-3 text-secondary'"
  ></app-spinner>
}
