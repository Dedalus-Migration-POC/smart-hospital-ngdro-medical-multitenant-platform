@if (pageConfig(); as pageConfig) {
  @if (pageConfig.breadcrumb) {
    <app-breadcrumb [config]="breadcrumbConfig()"></app-breadcrumb>
  }
}

<router-outlet></router-outlet>

@if (loading()) {
  <app-spinner
    [fullScreen]="true"
    text="Loading"
    [className]="'flex-column gap-3 text-secondary'"
  ></app-spinner>
}
