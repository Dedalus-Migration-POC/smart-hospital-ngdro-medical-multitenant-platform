<section class="container py-4">
  <h1 class="h3 mb-4">{{ 'bookingTitle' | translate: { location: '' } }}</h1>

  <div class="cards-container row g-3">
    @for (card of cards; track card.targetUrl) {
      <div class="col-12 col-md-6 col-xl-3">
        <button
          type="button"
          class="card shadow booking-type-card h-100 w-100 text-start"
          (click)="onCardClick(card.targetUrl)"
        >
          <img class="card-img-top" [src]="card.imageUrl" alt="" aria-hidden="true" />
          <span class="card-body">
            <span class="card-title h5 d-block mb-0">{{ card.titleKey | translate }}</span>
          </span>
        </button>
      </div>
    }
  </div>
</section>
