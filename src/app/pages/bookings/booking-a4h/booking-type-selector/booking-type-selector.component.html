@if (pageConfig(); as pageConfig) {
  @if (pageConfig.breadcrumb) {
    <app-breadcrumb [config]="breadcrumbConfig()"></app-breadcrumb>
  }
}

<section class="container py-4">
  <h1 class="h3 mb-4">{{ 'booking-a4h.bookingTypeTitle' | translate: { location: '' } }}</h1>

  <app-card [config]="cards()"></app-card>
</section>
@if (struttureLoading()) {
  <app-spinner
    [fullScreen]="true"
    text="Loading"
    [className]="'flex-column gap-3 text-secondary'"
  ></app-spinner>
}
