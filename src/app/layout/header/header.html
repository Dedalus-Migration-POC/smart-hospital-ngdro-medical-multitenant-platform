@if (header(); as header) {
  <header class="it-header-wrapper">
    @if (header?.topbar) {
      <app-topbar [topbar]="header.topbar!"></app-topbar>
    }

    <app-main-header [main]="header.main"></app-main-header>
    @if (header?.bottombar) {
      <app-bottombar [bottombar]="header.bottombar!"></app-bottombar>
    }
  </header>
}
