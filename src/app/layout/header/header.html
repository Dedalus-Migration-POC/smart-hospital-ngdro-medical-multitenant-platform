@if (header(); as header) {
  <header class="it-header-wrapper">
    <a href="javascript:void(0);" (click)="skipToMainContent()" class="skip text-primary">{{
      'tenant.skip-to-main-content' | translate
    }}</a>
    @if (header?.topbar) {
      <app-topbar [topbar]="header.topbar!"></app-topbar>
    }

    <app-main-header [main]="header.main"></app-main-header>
    @if (header?.bottombar) {
      <app-bottombar [bottombar]="header.bottombar!"></app-bottombar>
    }
  </header>
  <div #skipper tabindex="-1" class="skipper"></div>
}
